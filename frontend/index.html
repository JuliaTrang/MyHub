<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Hub ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #F0EEFF;
      color: #4a4063;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: 'Nunito', sans-serif; cursor: pointer; }
    input, textarea, select { font-family: 'Nunito', sans-serif; }
    /* Quill editor overrides */
    .ql-toolbar { border-radius: 12px 12px 0 0 !important; border-color: #d8cef6 !important; background: #faf8ff; }
    .ql-container { border-radius: 0 0 12px 12px !important; border-color: #d8cef6 !important; font-family: 'Nunito', sans-serif !important; font-size: 15px; min-height: 200px; }
    .ql-editor { min-height: 200px; line-height: 1.7; }
    .ql-editor.ql-blank::before { color: #b8aed4; font-style: normal; }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f0eeff; }
    ::-webkit-scrollbar-thumb { background: #c4b5f4; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
